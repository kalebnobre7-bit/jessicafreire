name: Publicar na Vercel

# A Vercel não está ligada ao GitHub: este workflow faz o mesmo que `npx vercel deploy --prod`
# a cada push na main. Precisa do secret VERCEL_TOKEN (vercel.com/account/tokens).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Conferir o token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Falta o secret VERCEL_TOKEN. Crie em vercel.com/account/tokens e cadastre em Settings > Secrets and variables > Actions."
            exit 1
          fi
      # O build roda na própria Vercel, com as variáveis de ambiente do projeto
      - run: npx --yes vercel@latest link --yes --project jessicafreire --token "$VERCEL_TOKEN"
      - run: npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"

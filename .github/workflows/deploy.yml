name: Redirecionar o GitHub Pages

# O painel mudou para a Vercel (jessicafreire.vercel.app), porque agora tem servidor
# para a entrada por senha. O Pages só serve a página de redirecionamento.

on:
  push:
    branches: [main]
    paths: ['pages-redirect/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pages-redirect
      - id: deployment
        uses: actions/deploy-pages@v4
